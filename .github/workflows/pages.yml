# Builds a static preview of the site and publishes it to GitHub Pages.
# The preview has no admin page and no enquiry storage (Pages has no server):
# forms hand the customer's details to WhatsApp instead. See README.md.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Remove server-only parts (admin, uploads, enquiry storage)
        run: node scripts/prepare-static.mjs

      - name: Build static site
        run: npx next build
        env:
          STATIC_EXPORT: '1'
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Fix prefetch files and pre-resize photos
        run: |
          node scripts/flatten-segments.mjs out
          node scripts/optimize-images.mjs out
          touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
